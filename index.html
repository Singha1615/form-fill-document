<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>กรอกฟอร์มเอกสารแรงงานต่างด้าว</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand"><span class="brand-mark">✎</span><span>กรอกฟอร์มเอกสาร</span></a>
      <ul class="nav-links" id="nav-links"></ul>
    </div>
  </nav>

  <main class="container">
    <header class="hero">
      <h1>ฟอร์มเอกสารแรงงานต่างด้าว</h1>
      <p class="muted">เลือกเอกสาร กรอกข้อมูลบนหน้าเว็บ แล้วดูตัวอย่างหรือดาวน์โหลดเป็น PDF ที่กรอกเรียบร้อยแล้ว</p>
      <span class="note">🔒 ข้อมูลที่กรอกอยู่ในเครื่องของคุณเท่านั้น (ยกเว้นเมื่อกดปุ่มแปลภาษา ข้อความที่แปลจะส่งไปที่ Google Translate)</span>
    </header>

    <section class="cards" id="cards"></section>
  </main>

  <footer class="footer">กรอกฟอร์มเอกสาร · ใช้งานฟรี</footer>

  <script type="module">
    import { DOCS, DOC_ORDER } from "./js/docs.js";
    const cards = document.getElementById("cards");
    const nav = document.getElementById("nav-links");
    nav.innerHTML = `<li><a href="index.html" class="active">หน้าแรก</a></li>`;
    for (const id of DOC_ORDER) {
      const d = DOCS[id];
      const a = document.createElement("a");
      a.className = "card";
      a.href = `form.html?doc=${id}`;
      a.innerHTML = `
        <div class="card-top"><span class="code"></span><span class="pages">${d.pages} หน้า</span></div>
        <h3></h3><p></p><span class="go">กรอกฟอร์ม →</span>`;
      a.querySelector(".code").textContent = d.code;
      a.querySelector("h3").textContent = d.title;
      a.querySelector("p").textContent = d.desc;
      cards.appendChild(a);
      nav.insertAdjacentHTML("beforeend", `<li><a href="form.html?doc=${id}">${d.code}</a></li>`);
    }
  </script>
</body>
</html>
